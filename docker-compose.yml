# docker compose up --build    ->  http://localhost:8080  (maker/maker123, checker/checker123)
# The first start also processes April-June from the spreadsheet as already paid (SEED_ARGS="" skips that;
# later starts skip it by themselves). Horilla runs outside Compose: ./scripts/horilla.sh setup && start.
# Every service can be restarted (docker compose restart) without losing a waiting month:
# Temporal keeps its state in the temporal-data volume, the payroll data is in Postgres.
x-app: &app
  build: .
  env_file: [{ path: .env, required: false }]
  environment: &env
    # These beat the same names in .env (which may point at a local database).
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: payroll
    POSTGRES_USER: payroll
    POSTGRES_PASSWORD: payroll
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_UI_URL: http://localhost:8233
    WORKFLOW_BACKEND: temporal
    DEMO_HRMS_URL: http://mock-hrms:8100/
    HORILLA_URL: http://host.docker.internal:8000/
    DJANGO_ALLOWED_HOSTS: "*"
    DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    # The Claude Code login does not exist inside a container: use the API (set ANTHROPIC_API_KEY in .env)
    # or the rule-based suggesters. AI_PROVIDER=cli from a local .env is overridden here.
    AI_PROVIDER: "${DOCKER_AI_PROVIDER:-auto}"
  extra_hosts: ["host.docker.internal:host-gateway"]
  volumes: ["app-data:/data"]
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: payroll, POSTGRES_USER: payroll, POSTGRES_PASSWORD: payroll }
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U payroll -d payroll"], interval: 3s, retries: 20 }
    restart: unless-stopped

  temporal:
    <<: *app
    command: ["temporal", "server", "start-dev", "--ip", "0.0.0.0", "--port", "7233", "--ui-port", "8233",
              "--db-filename", "/temporal/temporal.db", "--log-level", "error"]
    volumes: ["temporal-data:/temporal"]
    ports: ["8233:8233"]
    healthcheck: { test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"], interval: 3s, retries: 30 }

  web:
    <<: *app
    command: ["bash", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput -v 0 && python manage.py seed_demo $${SEED_ARGS---with-history} && exec gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 1 --threads 8 --timeout 180"]
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      temporal: { condition: service_healthy }

  worker:
    <<: *app
    command: ["python", "manage.py", "run_worker"]
    depends_on:
      db: { condition: service_healthy }
      temporal: { condition: service_healthy }
      web: { condition: service_started }

  mock-hrms:
    <<: *app
    working_dir: /app
    command: ["python", "-u", "mock_hrms/app.py", "--host", "0.0.0.0", "--port", "8100"]
    ports: ["8100:8100"]

volumes:
  app-data:
  db-data:
  temporal-data:
